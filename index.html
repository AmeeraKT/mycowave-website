<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MycoWave – Hear the mushrooms</title>
<link rel="icon" href="images/mycowave-mascot.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&amp;family=Lexend:wght@400;500;600&amp;display=swap" rel="stylesheet">
<style>
/* --u is one "design pixel". It shrinks evenly with the window, so every
   element scales together and nothing gets stretched. The page is designed
   at about 1180 x 840; on anything bigger it stays at full size. */
:root{
  --u: min(1px, calc(100vh / 840), calc(100vw / 1180));
  --u: min(1px, calc(100dvh / 840), calc(100vw / 1180));
}
html,body{margin:0;background:#FFFFFF}
a{color:#7B52A3}a:hover{color:#5E3D80}

.page{height:100vh;height:100dvh;overflow:hidden;box-sizing:border-box;
  padding:calc(32*var(--u)) 24px;display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:calc(28*var(--u));font-family:'Lexend',sans-serif;color:#1A0B2E;background:#FFFFFF}

.top{width:100%;max-width:calc(1180*var(--u));display:flex;align-items:center}
.logo{display:flex;align-items:center;gap:calc(12*var(--u));font-family:'Fredoka',sans-serif;font-weight:700;font-size:calc(28*var(--u));color:#7B52A3}
.logo-dot{width:calc(44*var(--u));height:calc(44*var(--u));border-radius:999px;background:#EFE7F7;display:flex;align-items:center;justify-content:center}
.logo-dot svg{width:calc(26*var(--u));height:calc(26*var(--u))}

.intro{display:flex;flex-direction:column;align-items:center;gap:calc(10*var(--u));text-align:center}
.intro p{margin:0;font-size:calc(22*var(--u));font-weight:500;color:#7B52A3}
.intro h1{margin:0;font-family:'Fredoka',sans-serif;font-weight:700;font-size:calc(96*var(--u));line-height:1;letter-spacing:-0.01em}

.cards{width:100%;max-width:calc(1000*var(--u));display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:calc(32*var(--u))}
.choice{text-decoration:none;border-radius:calc(40*var(--u));padding:calc(32*var(--u)) calc(28*var(--u)) calc(36*var(--u));
  display:flex;flex-direction:column;align-items:center;gap:calc(16*var(--u));box-sizing:border-box;
  transition:transform .25s cubic-bezier(.34,1.56,.64,1)}
.choice:hover{transform:translateY(calc(-8*var(--u))) rotate(-1.5deg)}
.choice:hover .bob{transform:rotate(-8deg) scale(1.06)}
.choice:focus-visible{outline:4px solid #1A0B2E;outline-offset:6px}
.kid{color:#1A0B2E;background:#D07AC8}
.myco{color:#FFFFFF;background:#7B52A3}

.bob{position:relative;width:calc(200*var(--u));height:calc(200*var(--u));border-radius:999px;display:flex;align-items:center;justify-content:center;
  transition:transform .3s cubic-bezier(.34,1.56,.64,1)}
.bob img{width:calc(164*var(--u));height:calc(164*var(--u));object-fit:contain}
.goggles{position:absolute;left:calc(55.5*var(--u));top:calc(103*var(--u));width:calc(69*var(--u));height:calc(27*var(--u))}

.label{font-family:'Fredoka',sans-serif;font-weight:700;font-size:calc(60*var(--u));line-height:1}
.sub{font-size:calc(22*var(--u));font-weight:500}
.btn{margin-top:calc(4*var(--u));font-family:'Fredoka',sans-serif;font-weight:600;font-size:calc(22*var(--u));border-radius:999px;
  padding:calc(12*var(--u)) calc(28*var(--u));display:flex;align-items:center;gap:calc(10*var(--u))}
.btn svg{width:calc(22*var(--u));height:calc(22*var(--u))}

.note{margin:0;font-size:calc(18*var(--u));color:#4A3A5C;text-align:center}

/* Phones: two cards side by side won't fit, so stack them and allow scrolling */
@media (max-width: 700px){
  :root{--u:0.8px}
  .page{height:auto;min-height:100vh;overflow:visible;justify-content:flex-start}
  .cards{grid-template-columns:minmax(0,1fr)}
}
</style>
</head>
<body>
<main class="page">
<div class="top">
<div class="logo">
<span class="logo-dot">
<svg viewBox="0 0 24 24" fill="none" stroke="#7B52A3" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M2 12c2-4 4-4 6 0s4 4 6 0 4-4 6 0"></path></svg>
</span>
MycoWave
</div>
</div>

<div class="intro">
<p>Help us make this just right for you!</p>
<h1>Are you a…</h1>
</div>

<div class="cards">
<a href="kids.html" class="choice kid">
<div class="bob" style="background:#F7E6F4">
<img src="images/mycowave-mascot.png" alt="MycoWave mushroom mascot">
</div>
<span class="label">Kid</span>
<span class="sub">Let’s listen to mushrooms!</span>
<span class="btn" style="background:#1A0B2E;color:#FFFFFF">
Start
<svg viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14"></path><path d="M13 6l6 6-6 6"></path></svg>
</span>
</a>

<a href="mycologist.html" class="choice myco">
<div class="bob" style="background:#EFE7F7">
<img src="images/mycowave-mascot.png" alt="MycoWave mushroom mascot wearing science goggles">
<svg class="goggles" viewBox="0 0 76 30" aria-hidden="true">
<path d="M0 15h9M67 15h9" stroke="#1A0B2E" stroke-width="4" stroke-linecap="round"></path>
<circle cx="18" cy="15" r="12" fill="#C3D85A" fill-opacity="0.5" stroke="#1A0B2E" stroke-width="4"></circle>
<circle cx="58" cy="15" r="12" fill="#C3D85A" fill-opacity="0.5" stroke="#1A0B2E" stroke-width="4"></circle>
<path d="M30 15h16" stroke="#1A0B2E" stroke-width="4" stroke-linecap="round"></path>
</svg>
</div>
<span class="label">Mycologist</span>
<span class="sub">Data, recordings and the deep science</span>
<span class="btn" style="background:#C3D85A;color:#1A0B2E">
Enter
<svg viewBox="0 0 24 24" fill="none" stroke="#1A0B2E" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14"></path><path d="M13 6l6 6-6 6"></path></svg>
</span>
</a>
</div>

<p class="note">You can switch any time from the bottom of the page.</p>
</main>
</body>
</html>
